
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync publishable materials
        run: npm run sync-materials

      - name: Check project
        run: npm run check

      - name: Generate public config
        env:
          API_URL: ${{ vars.BACKTRANSLATION_API_URL }}
        run: |
          node -e "
          const fs = require('fs');
          const url = process.env.API_URL;
          if (!url || !url.startsWith('https://') || !url.endsWith('/analyze')) {
            throw new Error('Invalid BACKTRANSLATION_API_URL');
          }
          fs.writeFileSync(
            'dist/config.js',
            'window.BACKTRANSLATION_CONFIG = ' +
            JSON.stringify({ apiUrl: url }) + ';'
          );
          "

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
